services:
    
  tol-sdk-python-unit-test:
    build: .
    container_name: unit-test
    command: pytest -v unit

  tol-sdk-python-db:
    image: postgres:14
    container_name: db
    # Useful when debugging to show all SQL statements in the log:
    # command: ["postgres", "-c", "log_statement=all"]
    # Trigger auto-vacuum (which runs ANALYZE) more frequently:
    command: ["postgres", "-c", "autovacuum_naptime=5"]
    environment:
      - POSTGRES_USER=test-user
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_DB=test-db
    ports:
      - 5556:5432
    networks:
      - api-base-test-network

  tol-sdk-python-elastic:
    image: elasticsearch:7.17.28
    container_name: elastic
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
    networks:
      - api-base-test-network
    healthcheck:
      test: curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 1s
      retries: 120

  tol-sdk-python-system-test:
    build: .
    container_name: system-test
    command: pytest -vvvx system
    environment:
      - DB_URI=postgresql://test-user:test-password@tol-sdk-python-db:5432/test-db
      - ELASTIC_URI=http://tol-sdk-python-elastic:9200
      - ELASTIC_USER=elastic
      # needs to be set, but doesn't matter at all
      - ELASTIC_PASSWORD=anything
      - ELASTIC_INDEX_PREFIX=test
      - RABBITMQ_HOST=tol-sdk-python-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=test-user
      - RABBITMQ_PASSWORD=test-password
      - RABBITMQ_MANAGEMENT_URL=http://tol-sdk-python-rabbitmq:15672
      - NOTIFICATION_API_URL=http://system-test-api-notification:5000
    depends_on:
      - system-test-api-elastic
      - system-test-api-sql
      - system-test-api-notification
    networks:
      - api-base-test-network

  system-test-api-elastic:
    build: .
    container_name: api-elastic
    command: flask --app elastic run --host 0.0.0.0 --debugger
    working_dir: /test/system/data_source/services
    environment:
      - ELASTIC_URI=http://tol-sdk-python-elastic:9200
      - ELASTIC_USER=elastic
      # needs to be set, but doesn't matter at all
      - ELASTIC_PASSWORD=anything
      - ELASTIC_INDEX_PREFIX=test-api
      - FLASK_DEBUG=1
    depends_on:
      tol-sdk-python-elastic:
        condition: service_healthy
    networks:
      - api-base-test-network
    ports:
      - '9023:5000'

  system-test-api-sql:
    build: .
    container_name: api-sql
    command: flask --app sql run --host 0.0.0.0 --debugger
    working_dir: /test/system/data_source/services
    environment:
      - DB_URI=postgresql://test-user:test-password@tol-sdk-python-db:5432/test-db
      - FLASK_DEBUG=1
    networks:
      - api-base-test-network
    depends_on:
      - tol-sdk-python-db
    ports:
      - '9021:5000'

  system-test-api-notification:
    build: .
    container_name: api-notification
    command: flask --app notification run --host 0.0.0.0 --debugger
    working_dir: /test/system/data_source/services
    environment:
      - RABBITMQ_HOST=tol-sdk-python-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=test-user
      - RABBITMQ_PASSWORD=test-password
      - RABBITMQ_MANAGEMENT_URL=http://tol-sdk-python-rabbitmq:15672
      - FLASK_DEBUG=1
    depends_on:
      tol-sdk-python-rabbitmq:
        condition: service_healthy
    networks:
      - api-base-test-network
    ports:
      - '9025:5000'

  tol-sdk-python-integration-test:
    build: .
    container_name: integration-test
    command: pytest -vvvx integration
    environment:
      - GOOGLE_CLIENT_SECRETS
      - JIRA_URL
      - JIRA_API_KEY
      - GOAT_URL
      - GOAT_API_PATH
      - MLWH_URI
      - BENCHLING_URL
      - BENCHLING_API_KEY
      - BENCHLING_REGISTRY_ID
      - BENCHLING_PROJECT
      - BENCHLING_PROJECT_ID
      - BENCHLING_CASM_PROJECT_ID
      - BENCHLING_FOLDER
      - ENA_URL
      - ENA_USER
      - ENA_PASSWORD
      - ENA_CONTACT_NAME
      - ENA_CONTACT_EMAIL
      - PORTAL_URL
      - PORTAL_API_PATH
      - PORTAL_API_KEY
      - STS_URL
      - STS_API_KEY
      - BOLD_API_KEY
      - S3_URI
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_SECURE
      - ELASTIC_URI
      - ELASTIC_USER
      - ELASTIC_PASSWORD
      - ELASTIC_INDEX_PREFIX
      - RABBITMQ_HOST=tol-sdk-python-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=test-user
      - RABBITMQ_PASSWORD=test-password
      - RABBITMQ_MANAGEMENT_URL=http://tol-sdk-python-rabbitmq:15672
    depends_on:
      tol-sdk-python-rabbitmq:
        condition: service_healthy
    networks:
      - api-base-test-network

  tol-sdk-python-rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=test-user
      - RABBITMQ_DEFAULT_PASS=test-password
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - api-base-test-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  api-base-test-network: {}
