[metadata]
name = tol-sdk
version = 0.1.2
author = ToL Platforms Team
author_email = tol-platforms@sanger.ac.uk
description = SDK for interaction with ToL services
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.internal.sanger.ac.uk/tol/platforms/tol-sdk
project_urls =
    Jira = https://jira.sanger.ac.uk/secure/RapidBoard.jspa?rapidView=32&projectKey=TOLP
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =
    requests
    datetime
    benchling-sdk
    prefect
    Flask-SQLAlchemy

[options.packages.find]
where = src
