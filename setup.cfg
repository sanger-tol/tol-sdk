[metadata]
name = tol-sdk
version = 1.4.12
author = ToL Platforms Team
author_email = tol-platforms@sanger.ac.uk
description = SDK for interaction with ToL services
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.internal.sanger.ac.uk/tol/platforms/tol-sdk
project_urls =
    Jira = https://jira.sanger.ac.uk/secure/RapidBoard.jspa?rapidView=32&projectKey=TOLP
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    cachetools == 5.3.3
    requests == 2.31.0
    python_dateutil >= 2.8.1
    setuptools == 69.0.3
    case-converter==1.1.0
    Click === 8.1.7
    more-itertools == 10.2.0
    pytz >= 2025.1

[options.extras_require]
all =
    %(api-base)s
    %(benchling)s
    %(elastic)s
    %(irods)s
    %(jira)s
    %(json)s
    %(mysql)s
    %(postgresql)s
    %(prefect)s
    %(sciops)s
    %(sheets)s
api-base = 
    Flask == 2.2.2
    Werkzeug == 2.2.2
benchling =
    benchling-sdk
elastic =
    elasticsearch == 7.17.9
irods =
    python-irodsclient == 1.1.6
jira =
    atlassian-python-api==3.41.14
json =
    minio == 7.1.0
mysql =
    mysql-connector-python
postgresql =
    SQLAlchemy == 2.0.1
    psycopg2-binary == 2.9.9
prefect =
    prefect[gitlab] >= 2, < 3
    griffe < 1.0.0
sciops =
    lab-share-lib @ git+https://github.com/sanger/lab-share-lib@v0.1.6#egg=lab-share-lib
    fastavro # Dependency of lab-share-lib
    pika
    python-snappy
sheets =
    pandas == 2.1.4
    openpyxl >= 3.0.10  # STS uses save_virtual_workbook from version 3.0.x
    XlsxWriter == 3.1.9
    xlrd == 2.0.1
    gspread >= 5.12.0

[options.packages.find]
where = src

[options.package_data]
tol = ../certs/cacert.pem
tol.benchling.sql =
    *.sql

[options.entry_points]
console_scripts =
    tol = tol.cli:cli
