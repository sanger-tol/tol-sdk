[metadata]
name = tol-sdk
version = 0.9.5
author = ToL Platforms Team
author_email = tol-platforms@sanger.ac.uk
description = SDK for interaction with ToL services
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.internal.sanger.ac.uk/tol/platforms/tol-sdk
project_urls =
    Jira = https://jira.sanger.ac.uk/secure/RapidBoard.jspa?rapidView=32&projectKey=TOLP
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7
install_requires =
    requests
	requests_mock
    benchling-sdk
    prefect
    python_dateutil == 2.8.1
    setuptools == 53.0.0
    #markupsafe==2.0.1
    case-converter==1.1.0
    #jwt
    #alembic==1.8.0
    Click
    fastavro # Dependency of lab-share-lib
    more-itertools
    pika
    #python-dotenv
    python-snappy
    jira==3.4.1
    lab-share-lib @ git+https://git@github.com/sanger/lab-share-lib.git@v0.1.5
    mysql-connector-python
    elasticsearch == 7.17.9
    python-irodsclient == 1.1.6

[options.extras_require]
all =
    %(api_base)s
api_base =
  Flask == 2.2.2
  SQLAlchemy == 2.0.1
  Flask-SQLAlchemy == 3.0.3
  flask-restx == 1.0.5
  marshmallow == 3.19.0
  flask-marshmallow == 0.14.0
  marshmallow-sqlalchemy == 0.28.1
  marshmallow-jsonapi == 0.24.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tol = tol.cli:cli
