# This is used for local development only
version: '3.1'

services:
  api-base-db:
    image: postgres:11
    environment:
      - POSTGRES_USER=test-user
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_DB=test-db
    networks:
      - api-base-test-network
    
  api-base-test:
    build: .
    command: bash -c "pytest -vx"
    environment:
      - DB_URI=postgresql://test-user:test-password@api-base-db:5432/test-db
    depends_on:
      - api-base-db
    networks:
      - api-base-test-network

networks:
  api-base-test-network:
