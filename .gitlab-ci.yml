# Used to set up the build environment
variables:
  DOCKER_IMAGE: $CI_REGISTRY/tol/tol-core/build-base:1.0.0
  DIND_IMAGE: $CI_REGISTRY/tol/tol-core/dind:1.0.0


include:
  - project: 'tol/tol-core'
    ref: v1.3.6
    file: '/gitlab/python-package.yml'


# TODO remove
unit-test-api-base-2:
  image: python:3.10
  extends: .unit-test-python
  variables:
    TEST_TYPE: unit2
    TEST_BASE_DIR: dup-
    TEST_DIR: '/../test' # hacky directory traversal :(
  rules:
    - if: $CI_COMMIT_REF_NAME == "qa"
      when: never
    - if: $CI_COMMIT_REF_NAME == "staging"
      when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - when: always


system-test-api-base-2:
  image: python:3.10
  extends: .system-test-python
  variables:
    TEST_TYPE: system2
    TEST_BASE_DIR: dup-
    TEST_DIR: '/../test'
  rules:
    - if: $CI_COMMIT_REF_NAME == "qa"
      when: never
    - if: $CI_COMMIT_REF_NAME == "staging"
      when: never
    - if: $CI_COMMIT_REF_NAME == "production"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - when: always

