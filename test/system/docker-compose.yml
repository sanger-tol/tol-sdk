version: '3.1'

services:

  db:
    image: postgres:12
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - test-network
    
  system-test:
    image: ${BUILT_IMAGE}
    command: pytest -v system
    environment:
      - DB_URI={DB_URI}
      - GOOGLE_CLIENT_SECRETS=${GOOGLE_CLIENT_SECRETS}
      - UUID_PREFIX=${UUID_PREFIX}
      - ELASTIC_URI=${ELASTIC_URI}
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_INDEX_PREFIX=${ELASTIC_INDEX_PREFIX}
    depends_on:
      - db
      - system-test-api-elastic
      - system-test-api-sql
    networks:
      - test-network

  system-test-api-elastic:
    image: ${BUILT_IMAGE}
    command: flask --app elastic run --host 0.0.0.0
    working_dir: /test/system/data_source/services
    environment:
      - UUID_PREFIX=${UUID_PREFIX}
      - ELASTIC_URI=${ELASTIC_URI}
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_INDEX_PREFIX=${ELASTIC_INDEX_PREFIX}
    networks:
      - test-network

  system-test-api-sql:
    image: ${BUILT_IMAGE}
    command: flask --app sql run --host 0.0.0.0
    working_dir: /test/system/data_source/services
    environment:
      - DB_URI=${DB_URI}
    networks:
      - test-network
    depends_on:
      - db

  benchmark:
    image: ${BUILT_IMAGE}
    command: python3 -m performance.all
    working_dir: /test/performance
    environment:
      - DB_URI=${DB_URI}
    networks:
      - test-network
    depends_on:
      - db

networks:
  test-network:
