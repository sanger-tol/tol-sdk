version: '3.1'

services:

  db:
    image: postgres:14
    # Useful when debugging to show all SQL statements in the log:
    # command: ["postgres", "-c", "log_statement=all"]
    # Trigger auto-vacuum (which runs ANALYZE) more frequently:
    command: ["postgres", "-c", "autovacuum_naptime=5"]
    environment:
      - POSTGRES_USER=test-user
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_DB=test-db
    networks:
      - test-network

  elastic:
    image: elasticsearch:7.17.28
    environment:
      - discovery.type=single-node
    networks:
      - test-network

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=test-user
      - RABBITMQ_DEFAULT_PASS=test-password
    networks:
      - test-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10
    
  system-test:
    image: ${BUILT_IMAGE}
    command: pytest -v system
    environment:
      - DB_URI=postgresql://test-user:test-password@db:5432/test-db
      - GOOGLE_CLIENT_SECRETS=${GOOGLE_CLIENT_SECRETS}
      - ELASTIC_URI=http://elastic:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=anything
      - ELASTIC_INDEX_PREFIX=test
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=test-user
      - RABBITMQ_PASSWORD=test-password
      - RABBITMQ_MANAGEMENT_URL=http://rabbitmq:15672
    depends_on:
      - db
      - elastic
      - system-test-api-elastic
      - system-test-api-sql
      - system-test-api-notification
    networks:
      - test-network

  system-test-api-elastic:
    image: ${BUILT_IMAGE}
    command: flask --app elastic run --host 0.0.0.0
    working_dir: /test/system/data_source/services
    environment:
      - ELASTIC_URI=http://elastic:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=anything
      - ELASTIC_INDEX_PREFIX=test-api
    networks:
      - test-network
    depends_on:
      - elastic
    restart: always

  system-test-api-sql:
    image: ${BUILT_IMAGE}
    command: flask --app sql run --host 0.0.0.0
    working_dir: /test/system/data_source/services
    environment:
      - DB_URI=postgresql://test-user:test-password@db:5432/test-db
    networks:
      - test-network
    depends_on:
      - db
    restart: always

  system-test-api-notification:
    image: ${BUILT_IMAGE}
    command: flask --app notification run --host 0.0.0.0
    working_dir: /test/system/data_source/services
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=test-user
      - RABBITMQ_PASSWORD=test-password
      - RABBITMQ_MANAGEMENT_URL=http://rabbitmq:15672
    networks:
      - test-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

networks:
  test-network:
